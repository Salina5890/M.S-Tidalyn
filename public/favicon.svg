<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tidalyn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071933" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="wing-grad-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="wing-grad-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="wave-subtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="48" height="48" rx="12" fill="url(#tidalyn-bg)" />
  <rect width="48" height="48" rx="12" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.2" />

  <!-- Subtle ocean wave baseline -->
  <path d="M 8 36 C 14 33, 20 38, 26 35 C 32 32, 38 36, 42 34" stroke="url(#wave-subtle)" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Stylized M.S Tidalyn in Soaring Flight -->
  <!-- Left sweeping wing -->
  <path d="M 24 21 C 18 16, 11 15, 7 17 C 12 21, 18 22, 22 24.5 Z" fill="url(#wing-grad-left)" />
  
  <!-- Right soaring dynamic wing -->
  <path d="M 24 21 C 30 14, 38 12, 42 13 C 37 18, 30 20.5, 25.5 24 Z" fill="url(#wing-grad-right)" />
  
  <!-- Core fuselage & aerodynamic tail -->
  <path d="M 24 17.5 C 24.8 19 25 21 24.8 26 C 24.6 28 23.6 30 23.2 31.5 C 23.8 30 24.2 27 24 25 Z" fill="#F8FAFC" />
  
  <!-- Head accent soaring forward -->
  <circle cx="24" cy="18" r="1.5" fill="#FFFFFF" />
</svg>
